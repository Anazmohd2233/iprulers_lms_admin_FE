<div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                <div class="card">
                    <!-- Logo -->
                    <div class="card-header pt-4 pb-4 text-center bg-primary">
                        <a [routerLink]="['/']">
                            <span><img src="assets/images/logo.webp" alt="" height="18"></span>
                        </a>
                    </div>

                    <div class="card-body p-4">

                        <div class="text-center w-75 m-auto">
                            <h4 class="text-dark-50 text-center mt-0 fw-bold">Reset Password</h4>
                            <p class="text-muted mb-4" *ngIf="successMessage===''">Enter your email address and we'll
                                send you an email with
                                instructions to reset your password.</p>
                        </div>

                        <ngb-alert type="success" *ngIf="successMessage!==''" [dismissible]="false" class="mt-3">{{
                            successMessage }}
                        </ngb-alert>

                        <form name="reset-password-form" [formGroup]="resetPassswordForm" (ngSubmit)="onSubmit()"
                            *ngIf="successMessage===''">

                            <div class="mb-3">
                                <label for="emailaddress" class="form-label">Email address</label>
                                <input class="form-control" type="email" id="emailaddress"
                                    placeholder="Enter your email" formControlName="email"
                                    [ngClass]="{'is-invalid': formSubmitted && formValues.email.invalid}" required>

                                <div *ngIf="formSubmitted && formValues.email.invalid" class="invalid-feedback">

                                    <div *ngIf="formValues.email.errors?.required">
                                        Email is required.
                                    </div>
                                    <div *ngIf="formValues.email.errors?.email">
                                        Email must be a valid Email Address
                                    </div>

                                </div>

                            </div>

                            <div class="mb-0 text-center">
                                <button class="btn btn-primary" type="submit">Reset Password</button>
                            </div>
                        </form>
                    </div> <!-- end card-body-->
                </div>
                <!-- end card -->

                <div class="row mt-3">
                    <div class="col-12 text-center">
                        <p class="text-muted">Back to <a [routerLink]="['../login']" class="text-muted ms-1"><b>Log
                                    In</b></a></p>
                    </div> <!-- end col -->
                </div>
                <!-- end row -->

            </div> <!-- end col -->
        </div>
        <!-- end row -->
    </div>
    <!-- end container -->
</div>
<!-- end page -->

<footer class="footer footer-alt">
    2018 - {{today| date : 'yyyy'}} © Hyper - Coderthemes.com
</footer>
